  else if(a==="back"){S.phase="swipe";save();render()}
  else if(a==="refo"){S.refOpen=true;render()}else if(a==="food"){S.menu=false;S.fd=true;render()}else if(a==="vis"){if(S.isAdmin){const id=+v;if(S.vis[id])delete S.vis[id];else S.vis[id]=1;save();render()}}else if(a==="eat"){if(S.isAdmin){if(S.eat[v])delete S.eat[v];else S.eat[v]=1;save();render()}}else if(a==="fdel"){if(S.isAdmin){const f=foodAll().find(t=>t.id===v);if(f)ask(`Удалить из списка «${f.en}»?`,()=>{S.fx[v]=1;save();render()})}}else if(a==="frest"){S.fx={};save();render()}else if(a==="fadd"){const nm_=cl(document.getElementById("f_n").value).trim();if(nm_&&S.isAdmin){S.fc.push({k:document.getElementById("f_k").value==="p"?"p":"d",n:nm_,t:cl(document.getElementById("f_t").value)});save();render()}}else if(a==="awx")autoWx();else if(a==="rp"){S.rp={t:S.tour,i:+v};render()}else if(a==="rpick"){const b=S.blocks.find(t=>t.id===S.rp.t),id=S.rp.i,n=+v;if(b){const k=b.items.indexOf(id);if(k>=0){b.items[k]=n;if(b.date&&!S.blocks.some(t=>t!==b&&t.st!=="skip"&&t.date&&t.items.includes(id)))delete S.dates[id];if(!S.sel.includes(n)&&!S.alt.includes(n))S.alt.push(n);S.rp=null;refit(b)}}}else if(a==="vm"){S.rv[S.day]=+v;render()}else if(a==="rbo"){const dd=v||S.day;if(!dayList().length){note("Сначала задайте даты поездки.");return}S.rb={date:dd||"",mode:S.wx[dd]==="storm"?"storm":"rain"};render()}else if(a==="rgo")buildRain();else if(a==="trn"){const b=S.blocks.find(t=>t.id===+v);if(b){if(!b.rain){if(b.date)b.items.forEach(i=>delete S.dates[i]);b.rain=true;b.rd=b.date;b.date=""}else{b.rain=false;b.storm=false;b.rd=""}refit(b)}}else if(a==="dprev"||a==="dnext"){const d=dayList(),j=d.indexOf(S.day)+(a==="dnext"?1:-1);if(j>=0&&j<d.length){S.day=d[j];render()}}else if(a==="day"){S.day=v;render()}else if(a==="up"||a==="dn")mv(+v,a==="up"?-1:1);else if(a==="pv"){S.preview=!S.preview;S.edit=false;render()}else if(a==="open"){S.open=+v;S.edit=false;render()}else if(a==="close"){if(S.rp){S.rp=null;render();return}if(S.open&&(S.tour||S.refOpen)){S.open=null;S.edit=false;render();return}S.open=null;S.add=null;S.menu=false;S.refOpen=false;S.fd=false;S.rb=null;cleanT();S.tour=null;S.story=false;S.edit=false;render()}else if(a==="menu"){S.menu=true;render()}else if(a==="build")buildBlocks();else if(a==="csv")exportCsv();else if(a==="bt"){S.bo=S.bo===false;render()}else if(a==="bak")dl("tokyo-backup-"+iso(new Date())+".json",JSON.stringify(snap(),null,1),"application/json");else if(a==="unskip"){ask("Вернуть пропущенные карточки в стопку «Тиндера»?",()=>commit(d=>{d.skip=[];d.done=false;d.ph="swipe"}))}else if(a==="wipe"){ask("Удалить весь план и начать заново? Сначала лучше скачать резервную копию.",()=>{try{localStorage.removeItem("tokyo-v1")}catch(e){}location.reload()})}else if(a==="rst"){ask("Вернуть карточке исходные данные?",()=>commit(d=>{delete d.ed[v]}))}else if(a==="del"){ask("Удалить эту добавленную карточку совсем?",()=>commit(d=>{const id=+v,f=q=>q.filter(i=>i!==id);d.sel=f(d.sel);d.skip=f(d.skip);d.alt=f(d.alt);delete d.cu[id];delete d.ed[id];d.blocks.forEach(b=>b.items=f(b.items));delete d.dates[id];for(const k in d.ord)d.ord[k]=f(d.ord[k])}))}else if(a==="openadd"){S.menu=false;S.add={q:"",busy:false,res:null,err:""};render()}else if(a==="addman")addMan();else if(a==="search")doSearch();else if(a==="exp")exportShowcase();else if(a==="addcu")addCu();else if(a==="edit"){S.edit=true;render()}else if(a==="noedit"){S.edit=false;render()}else if(a==="saveEd"){const g=i=>document.getElementById(i).value;applyEd(S.open,{en:g("e_en"),ja:g("e_ja"),cat:g("e_cat"),yen:g("e_yen"),h:g("e_h"),min:g("e_min"),o:g("e_o"),c:g("e_c"),v:g("e_v"),sh:g("e_sh"),w:g("e_w"),st:g("e_st"),ar:g("e_ar"),desc:g("e_desc"),bk:[g("e_bl"),g("e_bt")]});S.blocks.forEach(fixB);S.edit=false;save();render()}
  else if(a==="f"){S.filter=v;render()}
  else if(a==="mk"){const id=+v;S.alt=S.alt.filter(i=>i!==id);S.sel.push(id);save();render()}else if(a==="pp"){const id=+v;S.sel=S.sel.filter(i=>i!==id);delete S.dates[id];S.alt.push(id);save();render()}else if(a==="rm"){const id=+v;S.open=null;S.alt=S.alt.filter(i=>i!==id);S.sel=S.sel.filter(i=>i!==id);delete S.dates[id];S.filter="Все";save();render()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="imp"){importFile(e.target.files[0]);return}
  const sf=e.target.closest("select[data-fk]");if(sf){S.fk=sf.value;render();return}
  const sw=e.target.closest("select[data-wx]");if(sw){if(sw.value)S.wx[S.day]=sw.value;else delete S.wx[S.day];save();render();return}
  const sr=e.target.closest("select[data-rd]");if(sr){S.rb.date=sr.value;return}
  const sm=e.target.closest("select[data-rm]");if(sm){S.rb.mode=sm.value;return}
  const sd=e.target.closest("select[data-day]");if(sd){S.day=sd.value;render();return}
  const sc=e.target.closest("select[data-cat]");if(sc){S.filter=sc.value;render();return}
  const hi=e.target.closest("input[data-h]");if(hi){setHours(+hi.dataset.h,hi.value);return}
  const cn=e.target.closest("input[data-c]");if(cn){S.cfg[cn.dataset.c]=Math.max(0,Math.min(31,Math.round(+cn.value||0)));save();return}
  const sa=e.target.closest("select[data-ba]");if(sa){const id=+sa.value;if(id)tedit(b=>{if(!b.items.includes(id))b.items.push(id)});return}
  const sb=e.target.closest("select[data-bd]");if(sb){const b=S.blocks.find(x=>x.id==sb.dataset.bd);if(b)assign(b,sb.value);return}
  const t=e.target.closest("input[data-t]");if(t){if(t.dataset.t==="s"){S.trip.start=t.value;if(!S.trip.end||S.trip.end<t.value)S.trip.end=t.value}else S.trip.end=t.value;save();render();return}
  const i=e.target.closest("input[data-id]");if(!i)return;
  if(i.value)S.dates[i.dataset.id]=i.value;else delete S.dates[i.dataset.id];save();render();
});
document.addEventListener("keydown",e=>{if(S.open||S.add||S.menu||S.tour||S.refOpen||S.fd||S.rb||S.rp){if(e.key==="Escape"){if(S.rp){S.rp=null;render();return}if(S.open&&(S.tour||S.refOpen)){S.open=null;S.edit=false;render();return}S.open=null;S.add=null;S.menu=false;S.refOpen=false;S.fd=false;S.rb=null;cleanT();S.tour=null;S.story=false;S.edit=false;render()}return}if(!admin()||(S.phase!=="swipe"&&S.phase!=="tours"))return;if(e.key==="ArrowRight")act("main");if(e.key==="ArrowLeft")act("skip");if(e.key==="ArrowUp")act("alt")});
init();
</script>
